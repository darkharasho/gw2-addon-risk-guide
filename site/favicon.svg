<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="GW2 Addon Risk Guide">
  <!-- The masthead sigil redrawn as geometry. Tile radius and gradient track
       .sigil in style.css, so a palette change there wants one here too. The
       diamond is fatter than the glyph on purpose: 16px is where a favicon
       actually lives, and the faithful proportion disappears at that size. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9a441"/>
      <stop offset="1" stop-color="#a8762a"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="url(#g)"/>
  <path d="M16 7 25 16 16 25 7 16Z" fill="#1a1205"/>
</svg>
