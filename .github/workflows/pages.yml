name: Deploy Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # All that is left to publish is the forwarding page. The catalog it
      # used to carry, and the asset stamping that kept that catalog's
      # modules consistent across deploys, moved to axisite along with the
      # site itself.
      - name: Stage site
        run: |
          mkdir -p _site
          cp -r site/* _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
