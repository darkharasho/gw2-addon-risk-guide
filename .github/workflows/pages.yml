name: Deploy Pages
on:
  push: { branches: [main] }
  workflow_dispatch:
  workflow_run:
    workflows: [Refresh catalog]
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # workflow_run reports github.sha as the head commit from when the
      # triggering run STARTED, i.e. before its own "chore: refresh catalog"
      # commit. Check out the branch tip so the deploy ships the new catalog.
      - uses: actions/checkout@v4
        with: { ref: main }
      - name: Stage site
        run: |
          mkdir -p _site/data
          cp -r site/* _site/
          cp data/*.json _site/data/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
